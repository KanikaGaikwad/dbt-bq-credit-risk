version: 2

models:
  - name: int_kpis2
    description: "Intermediate model that engineers strategic KPIs for Client risk and exposure analysis"
    columns:
      - name: loan_id
        description: "Unique identifier for each loan"
        tests:
          - not_null
          - unique

      - name: client_debt_to_income_proxy
        description: "Proxy for debt-to-income ratio, calculated as (installment * 12) / annual income"
        tests:
          - not_null

      - name: months_active
        description: "Client tenure in months since loan issuance"
        tests:
          - not_null

      - name: dti_band
        description: "Categorical banding of debt-to-income proxy"
        tests:
          - not_null
          - accepted_values: 
              arguments:
                values:
                  - "High Burden"
                  - "Medium Burden"
                  - "Low Burden"
