models:
  - name: fact_loans
    description: "Fact table containing loan-level metrics and KPIs"
    columns:
      - name: loan_id
        description: "Unique identifier for each loan"
        tests:
          - unique
          - not_null

      - name: client_id
        description: "FK to dim_client"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: client_id

      - name: loan_issue_date
        description: "FK to dim_time"
        tests: 
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: date
