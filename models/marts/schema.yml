version: 2

models:
  - name: fct_client_risk
    description: "Mart model that segments clients by risk and value using engineered KPIs"
    columns:
      - name: loan_id
        description: "Unique identifier for each loan"
        tests:
          - not_null
          - unique

      - name: client_risk_segment
        description: "Combines DTI band and tenure to classify client risk"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "High Risk - New"
                  - "High Risk - Long Term"
                  - "Medium Risk"
                  - "Low Risk"

      - name: high_value_flag
        description: "Flags clients with high monthly capital exposure"
        tests:
          - not_null

      - name: monthly_capital_exposure_kpi
        description: "Monthly capital exposure calculated as loan amount divided by term in months"
        tests:
          - not_null

      - name: client_debt_to_income_proxy
        description: "Proxy for debt-to-income ratio, calculated as (installment * 12) / annual income"
        tests:
          - not_null

      - name: months_active
        description: "Client tenure in months since loan issuance"
        tests:
          - not_null

      - name: dti_band
        description: "Categorical banding of debt-to-income proxy"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "High Burden"
                  - "Medium Burden"
                  - "Low Burden"
