version: 2

models:
  - name: stg_loan_risk  # <--- NOTE: MUST USE YOUR ACTUAL MODEL NAME!
    description: "Cleans and standardizes raw loan data from BigQuery."
    columns:
      - name: loan_id
        tests:
          - unique
          - not_null

  - name: int_kpis
    description: "Generates key performance indicators (KPI) for loan portfolio."

  - name: dim_segments
    description: "Defines borrower risk segments for credit risk analysis."